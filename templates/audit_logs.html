{% extends 'base.html' %}
{% block title %}Audit Logs{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-clipboard-data"></i> Audit Logs</h2>
<div class="card card-custom p-4 mb-4">
    <button class="btn btn-gradient mb-3" onclick="exportLogs()"><i class="bi bi-download"></i> Export CSV</button>
    <div id="logsTable"></div>
</div>
<script>
async function fetchLogs() {
    const res = await fetch('/api/admin/audit_logs');
    return (await res.json()).logs || [];
}
function renderLogs(logs) {
    if (!logs.length) {
        document.getElementById('logsTable').innerHTML = '<div class="alert alert-warning">No logs found.</div>';
        return;
    }
    let html = `<table class='table table-dark table-striped'><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Event</th></tr></thead><tbody>`;
    for (const l of logs) {
        html += `<tr><td>${l.timestamp||''}</td><td>${l.user||''}</td><td>${l.action||''}</td><td>${l.event_id||''}</td></tr>`;
    }
    html += '</tbody></table>';
    document.getElementById('logsTable').innerHTML = html;
}
function exportLogs() {
    fetchLogs().then(logs => {
        if (!logs.length) return;
        let csv = 'Time,User,Action,Event\n';
        for (const l of logs) {
            csv += `${l.timestamp||''},${l.user||''},${l.action||''},${l.event_id||''}\n`;
        }
        const blob = new Blob([csv], {type: 'text/csv'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'audit_logs.csv';
        a.click();
        URL.revokeObjectURL(url);
    });
}
fetchLogs().then(renderLogs);
</script>
{% endblock %}
