{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-key"></i> Reset Password</h2>
<div class="card card-custom p-4 mb-4" style="max-width:400px;margin:auto;">
    <form id="resetForm">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" name="username" required>
        </div>
        <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" class="form-control" name="new_password" required>
        </div>
        <button type="submit" class="btn btn-gradient w-100">Reset Password</button>
    </form>
    <div id="resetMsg" class="mt-3"></div>
</div>
<script>
document.getElementById('resetForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const form = e.target;
    const username = form.username.value;
    const new_password = form.new_password.value;
    const res = await fetch('/api/auth/reset_password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, new_password })
    });
    const data = await res.json();
    document.getElementById('resetMsg').innerHTML = res.ok ? `<div class='alert alert-success'>${data.msg}</div>` : `<div class='alert alert-danger'>${data.msg}</div>`;
});
</script>
{% endblock %}
