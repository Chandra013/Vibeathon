{% extends 'base.html' %}
{% block title %}Submit Event{% endblock %}
{% block content %}
<h2>Submit New Event</h2>
<form id="eventForm">
    <div class="mb-3">
        <label class="form-label">Event Name</label>
        <input type="text" class="form-control" name="name" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Start Time</label>
        <input type="datetime-local" class="form-control" name="start_time" required>
    </div>
    <div class="mb-3">
        <label class="form-label">End Time</label>
        <input type="datetime-local" class="form-control" name="end_time" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Venue ID</label>
        <input type="text" class="form-control" name="venue_id" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Participant Count</label>
        <input type="number" class="form-control" name="participant_count" required>
    </div>
    <button type="submit" class="btn btn-success">Submit Event</button>
</form>
<script>
// Example: handle form submission with fetch to /api/events/submit
</script>
{% endblock %}
