<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Event Resource Management{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #18181b 0%, #27272a 100%);
            min-height: 100vh;
            color: #e0e7ef;
        }
        .navbar-custom {
            background: linear-gradient(90deg, #0ea5e9 0%, #6366f1 100%);
            box-shadow: 0 2px 8px rgba(59,130,246,0.08);
        }
        .navbar-brand {
            font-weight: bold;
            font-size: 1.6rem;
            letter-spacing: 1px;
            color: #fff !important;
        }
        .nav-link {
            color: #e0e7ef !important;
            font-weight: 500;
            display: flex;
            align-items: center;
        }
        .nav-link .bi {
            margin-right: 0.5em;
        }
        .nav-link.active, .nav-link:hover {
            color: #facc15 !important;
        }
        .footer {
            background: #18181b;
            color: #a5b4fc;
            text-align: center;
            padding: 1rem 0 0.5rem 0;
            margin-top: 4rem;
            border-radius: 1.5rem 1.5rem 0 0;
            box-shadow: 0 -2px 8px rgba(99,102,241,0.08);
        }
        .card-custom {
            border-radius: 1.25rem;
            box-shadow: 0 4px 24px rgba(59,130,246,0.10);
            border: none;
            background: #23232b;
            color: #e0e7ef;
        }
        .btn-gradient {
            background: linear-gradient(90deg, #0ea5e9 0%, #6366f1 100%);
            color: #fff;
            border: none;
        }
        .btn-gradient:hover {
            background: linear-gradient(90deg, #6366f1 0%, #0ea5e9 100%);
            color: #fff;
        }
        input, select, textarea {
            background: #23232b !important;
            color: #e0e7ef !important;
            border: 1px solid #6366f1 !important;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #0ea5e9 !important;
            box-shadow: 0 0 0 0.2rem rgba(14,165,233,0.25);
        }
        label {
            color: #a5b4fc;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-stars"></i> Event Resource Management
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="bi bi-speedometer2"></i>Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/event/submit"><i class="bi bi-calendar-plus"></i>Submit Event</a></li>
                    <li class="nav-item"><a class="nav-link" href="/approvals"><i class="bi bi-check2-square"></i>Approvals</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin"><i class="bi bi-gear"></i>Admin</a></li>
                    <li class="nav-item"><a class="nav-link" href="/login"><i class="bi bi-box-arrow-in-right"></i>Login</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div id="notification-area" style="position:fixed;top:1.5rem;right:1.5rem;z-index:2000;"></div>
    <div class="container mt-5 mb-5">
        {% block content %}{% endblock %}
    </div>
    <footer class="footer">
        <div><i class="bi bi-lightning-charge-fill"></i> Institutional Event Resource Management System &copy; 2026</div>
        <div style="font-size:0.9rem;">Crafted with <span style="color:#facc15;">&#9733;</span> by your team</div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    // Notification utility
    function showNotification(message, type = 'info', timeout = 3500) {
        const area = document.getElementById('notification-area');
        const alert = document.createElement('div');
        alert.className = `alert alert-${type} shadow-lg fade show`;
        alert.style.minWidth = '250px';
        alert.innerHTML = `<i class='bi bi-bell me-2'></i>${message}`;
        area.appendChild(alert);
        setTimeout(() => {
            alert.classList.remove('show');
            alert.classList.add('hide');
            setTimeout(() => area.removeChild(alert), 500);
        }, timeout);
    }
    </script>
</body>
</html>
